[package]
name = "aias"
version = "5.5.17"
description = "AIAS texture processing toolbox"
authors = ["AvroraCL"]
edition = "2021"

[features]
bake-validation = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "webp"] }
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }
# load-dynamic + api-17：任意 >= 1.17 的 onnxruntime.dll 均可加载（含 ComfyUI venv 的 1.23.x）
# cuda + preload-dylibs：注册 CUDAExecutionProvider，并把 CUDA12 + cuDNN9 运行时预载进进程，
#       配好依赖的机器自动 GPU 加速；缺依赖时 EP 注册失败会静默回退 CPU（默认 error_on_failure=false）。
ort = { version = "2.0.0-rc", default-features = false, features = ["std", "load-dynamic", "api-17", "cuda", "preload-dylibs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
sysinfo = "0.33"
texpresso = "2.0.2"
# 后处理逐像素阶段（box_mean/solidify/去污染/闭式分块）的 CPU 并行；
# 各实现保证逐元素结果与串行一致。
rayon = "1"
tempfile = "3"
base64 = "0.22"

# 烘焙工作进程挂入 KILL_ON_JOB_CLOSE 的 Job Object：宿主无论正常退出还是
# panic 闪退，内核都会随 job 句柄关闭终止工作进程，杜绝孤儿进程占 GPU/内存。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
# thin LTO：比 fat LTO 内存占用低得多（16GB 构建机可稳定完成），并行 codegen
# （不指定 codegen-units，用默认值换取低峰值内存）
lto = "thin"
strip = true
