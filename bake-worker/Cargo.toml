[package]
name = "aias-bake-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_Security", "Win32_Foundation", "Win32_System_JobObjects"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.8"
tobj = "4"
gltf = "1.4"
glam = { version = "0.30", features = ["serde"] }
base64 = "0.22"
sysinfo = "0.33"
tempfile = "3"

[build-dependencies]
cc = "1"

[profile.release]
strip = true
